<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Controle Parental">
  <title>Controle Parental AI - Chat</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/chat.css">
</head>

<body class="chat-app-wrapper--full">
  <div class="chat-messages">
    <aside class="material-alert chat-limit-alert" id="chat-limit-alert" hidden>
      <div class="material-alert__body">
        <strong class="material-alert__title">Instruções Importantes:</strong>
        <ul class="material-alert__list">
          <li>
            <p id="chat-limit-alert-text"></p>
          </li>
          <li>
            <p class="chat-limit-alert-text">Em caso de dúvidas, sugestões ou problemas, entre em contato com o <a
                class="chat-limit-alert-link" href="/help.html" rel="noopener noreferrer">suporte</a>.</p>
          </li>
        </ul>
      </div>
    </aside>
  </div>
  <div class="chat-input">
    <textarea name="txt-area" id="txt-area" rows="2" placeholder="Digite sua mensagem..."></textarea>
    <button type="button" id="send">
      <img src="./icons/send.svg" alt="Enviar mensagem">
    </button>
  </div>

  <script defer src="/_vercel/insights/script.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>

</html>
